<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YardFlow | Rail Yard Slot Planner</title><style>body{font:16px system-ui;background:#0d1726;color:#e9f0fa;margin:0}main{max-width:980px;margin:3rem auto;padding:1rem}h1{font-size:2.5rem}p{color:#a9bdd3}.panel{background:#17263b;border:1px solid #30445e;border-radius:14px;padding:22px;margin:20px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}label{font-size:13px;color:#b8cce0}input{display:block;width:90%;padding:12px;margin-top:8px;background:#0d1726;color:white;border:1px solid #536b86;border-radius:8px}button{background:#49d4bd;color:#062019;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}button.remove{background:#eaa5a5;color:#391010}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #35465b;text-align:left}#message{min-height:1.5rem;color:#f8c888}.muted{color:#b4c4d7}</style></head><body><main><h1>🚆 YardFlow</h1><p>Rail yard track allocation • Synthetic operations demo • All times are minutes after midnight</p><section class="panel"><h2>Reserve a track slot</h2><form id="slotForm"><label>Track<input name="track" value="A1" required pattern="[A-Z][0-9]{1,2}"></label><label>Train label<input name="train" value="FREIGHT 101" required maxlength="40"></label><label>Start minute<input name="start_min" type="number" value="480" min="0" max="1439" required></label><label>End minute<input name="end_min" type="number" value="540" min="1" max="1440" required></label><button type="submit">Reserve slot</button></form><p id="message" role="status"></p></section><section class="panel"><h2>Track occupancy</h2><div style="overflow:auto"><table><thead><tr><th>Track</th><th>Train</th><th>Start</th><th>End</th><th>Action</th></tr></thead><tbody id="slots"></tbody></table></div><p class="muted">Conflict prevention applies per track; adjacent intervals are allowed.</p></section></main><script>const form=document.querySelector('#slotForm'),message=document.querySelector('#message'),tbody=document.querySelector('#slots');async function refresh(){const r=await fetch('/api/slots');if(!r.ok){message.textContent='Unable to load slots';return}const slots=await r.json();tbody.replaceChildren();for(const s of slots){const tr=document.createElement('tr');for(const value of [s.track,s.train,s.start_min,s.end_min]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td'),b=document.createElement('button');b.className='remove';b.textContent='Release';b.onclick=async()=>{const r=await fetch('/api/slots/'+s.id,{method:'DELETE'});if(!r.ok)message.textContent='Could not release slot';await refresh()};td.append(b);tr.append(td);tbody.append(tr)}if(!slots.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='No slots yet. Add the first reservation.';tr.append(td);tbody.append(tr)}}form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.start_min=Number(data.start_min);data.end_min=Number(data.end_min);const r=await fetch('/api/slots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message.textContent=r.ok?'Reservation created':(await r.json()).detail;await refresh()};refresh();</script></body></html>
